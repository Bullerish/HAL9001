name: Deploy HAL9001

# Push-to-deploy for the hal9001.io box.
#
# IMPORTANT: this pipeline only ever builds + ships HAL9001.dll. It never sees any of HAL's
# secrets — ANTHROPIC_API_KEY, TURSO_*, STRIPE_* all live in /etc/hal9001/hal.env ON THE BOX
# and are read there at service start. CI only needs SSH access to copy the DLL and restart.
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST     - the server IP/hostname (set in repo secrets, not committed here)
#   DEPLOY_USER     - the SSH user that can chown + systemctl restart
#   DEPLOY_SSH_KEY  - the PRIVATE half of a deploy keypair whose PUBLIC half is in the
#                     server's ~/.ssh/authorized_keys

on:
  workflow_dispatch:        # manual: Actions tab → "Deploy HAL9001" → Run workflow
  push:                     # and automatically on every push to main
    branches: [ main ]
    paths-ignore:           # docs-only commits don't need a production restart
      - '**.md'
      - 'LICENSE'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build HAL9001.csproj -c Release

      - name: Publish (linux-x64, self-contained)
        run: dotnet publish HAL9001.csproj -c Release -r linux-x64 --self-contained -o ./publish-linux

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # NO ssh-keyscan. It opens one connection PER key algorithm and drops each at key exchange
          # without ever authenticating, which the box's fail2ban sshd jail (maxretry 4, see
          # deploy/harden.sh) can read as repeated failed logins — banning the runner and taking the
          # rest of the deploy with it. Runner IPs rotate, so it failed intermittently.
          # accept-new is the same trust-on-first-use that keyscan+known_hosts gave us, still refuses a
          # CHANGED host key, and costs one connection instead of four.
          {
            echo "Host deploytarget"
            echo "  HostName ${{ secrets.DEPLOY_HOST }}"
            echo "  User ${{ secrets.DEPLOY_USER }}"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking accept-new"
            echo "  ConnectTimeout 20"
            echo "  ServerAliveInterval 15"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      # One transient refusal should not throw away a good build — retry with backoff.
      - name: Copy DLL to server
        run: |
          for i in 1 2 3; do
            if scp ./publish-linux/HAL9001.dll deploytarget:/opt/hal9001/HAL9001.dll; then exit 0; fi
            echo "scp attempt $i failed; retrying in $((i*15))s"
            sleep $((i*15))
          done
          echo "could not copy the DLL after 3 attempts"; exit 1

      # NOTE: CI deliberately does NOT write to /etc/hal9001/hal.env. One-time steps have lived here
      # twice to set HAL_DAILY_USD (now 0.5 — the box reports limit:0.5); each was removed straight
      # after so the env file stays under human control and this pipeline ships nothing but the DLL.

      - name: Fix ownership and restart services
        run: |
          ssh deploytarget \
            "chown hal:hal /opt/hal9001/HAL9001.dll; \
             pkill -9 -f '[H]AL9001 swarm' || true; sleep 2; \
             systemctl restart hal-dashboard hal-swarm"

      - name: Verify dashboard is up
        run: |
          ssh deploytarget \
            "sleep 3 && curl -fs localhost:8765/api/wallet >/dev/null && echo 'dashboard OK'"
